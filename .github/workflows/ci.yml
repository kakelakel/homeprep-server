name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migration smoke test
        env:
          HOMEPREP_DATABASE_URL: sqlite:////tmp/homeprep-migration-test.db
        run: alembic upgrade head

      - name: Test
        env:
          HOMEPREP_DATA_DIR: /tmp/homeprep-test-data
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare HomePrep brand assets
        run: python scripts/sync_brand_assets.py
      - name: Install
        working-directory: web
        run: npm install
      - name: Build
        working-directory: web
        run: npm run build
      - name: Verify brand assets bundled
        run: |
          test -f web/dist/homeprep-icon.png
          test -f web/dist/homeprep-logo.png

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t homeprep-server:test .
      - name: Start container
        run: docker run -d --rm --name homeprep-server-test -p 8080:8080 homeprep-server:test
      - name: Wait for readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs homeprep-server-test
          exit 1
      - name: Verify bundled Web client
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="root"></div>'
          curl --fail --silent http://127.0.0.1:8080/homeprep-icon.png >/dev/null
          curl --fail --silent http://127.0.0.1:8080/homeprep-logo.png >/dev/null
      - name: Stop container
        if: always()
        run: docker stop homeprep-server-test || true
