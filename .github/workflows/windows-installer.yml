name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build Web client
        shell: pwsh
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build HomePrepServer.exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm packaging/windows/homeprep-server.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\HomePrep.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomePrep-Windows-Installer
          path: dist/installer/HomePrep-Setup.exe
          if-no-files-found: error
