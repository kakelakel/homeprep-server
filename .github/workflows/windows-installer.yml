name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build Web client
        shell: pwsh
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Build HomePrepServer.exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm packaging/windows/homeprep-server.spec

      - name: Smoke test Windows service
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\HomePrepServer.exe").Path
          $ready = $false
          try {
            & $exe --install-service
            & $exe --start-service
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/readyz" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              sc.exe query HomePrepServer
              throw "HomePrep Windows service did not become ready"
            }
          } finally {
            & $exe --stop-service
            Start-Sleep -Seconds 1
            & $exe --remove-service
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\HomePrep.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomePrep-Windows-Installer
          path: dist/installer/HomePrep-Setup.exe
          if-no-files-found: error
