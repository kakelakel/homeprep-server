services:
  homeprep-server:
    build:
      context: .
    container_name: homeprep-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOMEPREP_ENVIRONMENT: production
      HOMEPREP_DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
